# PocketWorld configuration.

# Enables verbose diagnostic logging (world load/unload timings, bridge selection details, etc).
debug: false

general:
  # Maximum number of pocket worlds a single player may own.
  max-worlds: 5
  # How long (in seconds) an empty, loaded pocket world waits before being automatically unloaded.
  # A world is only unloaded if it's STILL empty once this delay elapses - a member rejoining (or
  # another member logging in) before then cancels the pending unload.
  auto-unload-delay-seconds: 60
  # Serializes pocket-world creation/loading server-wide (one at a time) rather than letting many
  # requests land on the main thread in the same tick - see docs/ARCHITECTURE.md §18. Only worth
  # disabling if you've verified your hardware/player count don't need it; the queue's cost is
  # extra wait time for whoever's at the back of it, never server health.
  creation-queue-enabled: true
  # Extra pause (in seconds) between one queued creation/load finishing and the next one starting -
  # spreads server load out further than the queue alone does, at the cost of everyone behind the
  # front of the queue waiting longer. 0 (default) starts the next one immediately, matching the
  # queue's original behavior. Has no effect when creation-queue-enabled is false.
  creation-queue-delay-seconds: 0

# Difficulty applied to pocket worlds. One of: peaceful, easy, normal, hard.
world-difficulty: normal

# Metadata storage (users/worlds/themes) - independent of the Slime world-blob storage, which is
# always file-based in this version. If neither mongodb.use nor mysql.use is enabled, PocketWorld
# stores this metadata as local YAML files under plugins/PocketWorld/data/ instead - no external
# database required. Enabling both at once is an error.
mongodb:
  use: false
  uri: "mongodb://localhost:27017"
  database: pocketworld

mysql:
  use: false
  host: localhost
  port: 3306
  database: pocketworld
  username: root
  password: ""
